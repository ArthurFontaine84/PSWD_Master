[graph]
all-features = true

[advisories]
yanked = "deny"
# proc-macro-error n'est plus maintenue : ce n'est pas une faille. Macro utilisée seulement à la
# compilation, par la pile GTK de Tauri sous Linux ; aucune version de remplacement.
# À retirer dès que Tauri n'en dépend plus.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error abandonnée, utilisée à la compilation par GTK (Tauri, Linux)" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSL-1.0", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
# MPL-2.0 (copyleft faible, fichier par fichier) : dépendances internes de Tauri, utilisées sans
# modification. Toute nouvelle crate MPL reste refusée tant qu'elle n'est pas examinée.
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    # Liste des autorités de certification de Mozilla (licence permissive pour des données),
    # tirée par `rustls-platform-verifier` de `reqwest` ; inutilisée, le serveur est épinglé.
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
