[workspace]
resolver = "3"
members = [
    "crates/pswd-core",
    "crates/pswd-infra",
    "crates/pswd-app",
    "crates/pswd-gui/src-tauri",
    "crates/pswd-server",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
pswd-core = { path = "crates/pswd-core" }
pswd-infra = { path = "crates/pswd-infra" }
pswd-app = { path = "crates/pswd-app" }
arboard = { version = "3", default-features = false }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
etcetera = "0.11"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
hkdf = "0.13"
http-body-util = "0.1"
proptest = "1"
rand = { version = "0.10", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rusqlite = { version = "0.41", features = ["bundled", "serialize", "uuid"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

# Pas d'informations de débogage pour les dépendances : elles doublaient la taille de `target/`.
[profile.dev.package."*"]
debug = false

# Argon2 est trop lent sans optimisation : les tests en debug prendraient des minutes.
[profile.dev.package.argon2]
opt-level = 3

[workspace.lints.rust]
# `coverage_nightly` : positionné par cargo-llvm-cov, pour `#[coverage(off)]`.
# `fuzzing` : positionné par cargo-fuzz.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)", "cfg(fuzzing)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
