[workspace]
resolver = "3"
members = ["crates/pswd-core", "crates/pswd-infra", "crates/pswd-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
pswd-core = { path = "crates/pswd-core" }
pswd-infra = { path = "crates/pswd-infra" }
proptest = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
