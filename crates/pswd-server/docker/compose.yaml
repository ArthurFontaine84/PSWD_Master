# pswd-server en conteneur (docs/SERVEUR.md, § 7). Seul fichier à copier sur le serveur ;
# l'image est construite ailleurs puis chargée par `docker load`.
name: pswd-server

services:
  pswd-server:
    image: pswd-server
    # L'image est locale : ne jamais en télécharger une du même nom.
    pull_policy: never
    restart: unless-stopped
    # Port de la machine (à gauche) vers le port du serveur dans le conteneur.
    ports:
      - "8543:8443" # à modifier si le port 8543 est déjà utilisé sur le serveur
    # Volumes nommés : mêmes sous Linux et Windows, créés avec le propriétaire de l'image (10001).
    volumes:
      - donnees:/var/lib/pswd-server
      - sauvegardes:/sauvegardes
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  donnees:
  sauvegardes:
